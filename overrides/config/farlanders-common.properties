# The Farlanders Common Configuration

# Disables the Looter's ability to take the player's weapon (This makes them spawn with a random weapon from a loot table, good and bad.) (default: false)
disableLooterStealing=false

# Minimum apples required to tame an Enderminion (default: 5)
enderminionMinApple=5

# Chance for an apple to successfully tame an Enderminion (1 in X) (default: 7)
enderminionTameChance=7
